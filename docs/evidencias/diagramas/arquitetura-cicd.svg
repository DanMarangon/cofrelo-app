><text x="235.0" y="574.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">4. falhou? volta para a</text><text x="235.0" y="598.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">versão anterior (rollback)</text><rect x="470" y="420" width="300" height="260" rx="8" fill="#E8F2E6" stroke="#1D704F" stroke-width="1.6"/><text x="620.0" y="446.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D704F" text-anchor="middle" dominant-baseline="middle">app (PHP 8.3 + Apache)</text><text x="620.0" y="478.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">porta 8080, usuário www-data</text><text x="620.0" y="502.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">/health  ·  /metrics</text><text x="620.0" y="526.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">logs em JSON</text><text x="620.0" y="550.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">HEALTHCHECK do Docker</text><rect x="840" y="420" width="260" height="260" rx="8" fill="#FFFFFF" stroke="#1D704F" stroke-width="1.6"/><text x="970.0" y="446.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D704F" text-anchor="middle" dominant-baseline="middle">banco (MySQL 8.4)</text><text x="970.0" y="478.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">volume dados-mysql</text><text x="970.0" y="502.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">senhas no .env</text><text x="970.0" y="526.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">healthcheck mysqladmin</text><rect x="1170" y="420" width="360" height="260" rx="8" fill="#FFFFFF" stroke="#1D704F" stroke-width="1.6"/><text x="1350.0" y="446.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D704F" text-anchor="middle" dominant-baseline="middle">Observabilidade</text><text x="1350.0" y="478.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">Prometheus (porta 9090)</text><text x="1350.0" y="502.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">coleta /metrics a cada 15 s</text><text x="1350.0" y="526.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">4 regras de alerta</text><text x="1350.0" y="550.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">Grafana (porta 3000)</text><text x="1350.0" y="574.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">painel provisionado</text><line x1="400" y1="550" x2="470" y2="550" stroke="#5C6B64" stroke-width="1.6" marker-end="url(#seta)"/><line x1="770" y1="550" x2="840" y2="550" stroke="#5C6B64" stroke-width="1.6" marker-end="url(#seta)"/><path d="M1350,680 V712 H620 V684" fill="none" stroke="#5C6B64" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#seta)"/><text x="985" y="700.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#758079" text-anchor="middle" dominant-baseline="middle">o Prometheus coleta o /metrics da aplicação</text><path d="M1460,250 V330 H235 V420" fill="none" stroke="#5C6B64" stroke-width="1.6" marker-end="url(#seta)"/><text x="850" y="318.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#758079" text-anchor="middle" dominant-baseline="middle">a versão publicada é implantada pelo script</text></svg>