# Prometheus: coleta as métricas do Cofrelo a cada 15 segundos (perfil "observabilidade" do Compose).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: cofrelo
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
