<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/cofrelo/public

    <Directory /var/www/cofrelo/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Toda URL que não for um arquivo real (CSS, JS, imagens) vai para o roteador do PHP.
        FallbackResource /index.php
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        # CSS e JS: o navegador confere se mudou a cada acesso (responde 304 quando não mudou).
        <FilesMatch "\.(css|js)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>

    # O PHP registra cada requisição em JSON (src/Suporte/Log.php). O log de acesso do Apache fica
    # desligado para não duplicar as linhas em `docker compose logs`.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogLevel warn
</VirtualHost>
