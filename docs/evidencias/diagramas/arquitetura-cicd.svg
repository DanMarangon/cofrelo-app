<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6B64"/></marker><marker id="triangulo" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#182D26" stroke-width="1.2"/></marker></defs><rect x="30" y="60" width="220" height="190" rx="8" fill="#FFFFFF" stroke="#1D704F" stroke-width="1.6"/><text x="140.0" y="86.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D704F" text-anchor="middle" dominant-baseline="middle">Desenvolvimento</text><text x="140.0" y="118.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">branch feature/*</text><text x="140.0" y="142.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">commits padronizados</text><text x="140.0" y="166.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">testes locais</text><text x="140.0" y="190.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" dominant-baseline="middle">Pull Request</text><rect x="300" y="60" width="250" height="190" rx="8" fill="#FFFFFF" stroke="#1D704F" stroke-width="1.6"/><text x="425.0" y="86.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D704F" text-anchor="middle" dominant-baseline="middle">GitHub (GitFlow)</text><text x="425.0" y="118.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#182D26" text-anchor="middle" d