# O Dependabot verifica todo mês se há versões novas (e correções de segurança)
# das dependências do PHP, das actions usadas nos workflows e da imagem base do Docker.
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
